<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 军团 — 多智能体协同</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/marked@12.0.0/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080c18;
      --bg2: #0e1428;
      --surface: rgba(15, 23, 50, 0.7);
      --glass: rgba(25, 38, 75, 0.45);
      --glass-border: rgba(99, 102, 241, 0.15);
      --border: rgba(99, 102, 241, 0.12);
      --text: #e8eaff;
      --muted: #7b8ab8;
      --accent: #7c6cff;
      --accent2: #00d4ff;
      --user-bg: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      --green: #22d3a7;
      --yellow: #fbbf24;
      --red: #f87171;
      --pink: #f472b6;
      --cyan: #22d3ee;
      --radius: 14px;
    }

    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes float {
      0%,100% { transform: translateY(0px) rotate(0deg); }
      33%     { transform: translateY(-8px) rotate(1deg); }
      66%     { transform: translateY(4px) rotate(-1deg); }
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.8); opacity: 0.6; }
      50%  { transform: scale(1.1); opacity: 0.3; }
      100% { transform: scale(0.8); opacity: 0.6; }
    }
    @keyframes glow-text {
      0%,100% { text-shadow: 0 0 8px rgba(124,108,255,0.4); }
      50%     { text-shadow: 0 0 20px rgba(124,108,255,0.8), 0 0 40px rgba(0,212,255,0.3); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes typing-dot {
      0%,60%,100% { opacity: 0.3; }
      30%         { opacity: 1; }
    }
    @keyframes mascot-idle {
      0%,100% { transform: translateY(0) scale(1); }
      50%     { transform: translateY(-6px) scale(1.02); }
    }
    @keyframes star-twinkle {
      0%,100% { opacity: 0.3; }
      50%     { opacity: 1; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans SC', -apple-system, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 15% 20%, rgba(99,102,241,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(0,212,255,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(139,92,246,0.04) 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── 星空粒子背景 ── */
    .stars {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .star {
      position: absolute; border-radius: 50%; background: #fff;
      animation: star-twinkle ease-in-out infinite;
    }

    /* ── 侧边栏 ── */
    #sidebar {
      width: 270px; min-width: 270px; height: 100vh;
      background: var(--glass);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      display: flex; flex-direction: column; overflow: hidden;
      position: relative; z-index: 10;
    }

    .sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .sidebar-logo .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
      box-shadow: 0 0 20px rgba(124,108,255,0.4);
      font-family: 'Orbitron', monospace;
    }
    .sidebar-logo h2 {
      font-size: 1em; color: var(--text); font-weight: 700;
      font-family: 'Orbitron', monospace; letter-spacing: 1px;
    }
    .sidebar-logo .logo-sub {
      display: block; font-size: 0.6em; color: var(--muted);
      font-family: 'Noto Sans SC', sans-serif; letter-spacing: 0;
      font-weight: 400; margin-top: 2px;
    }

    .btn-new {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 10px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff; border: none; font-size: 0.88em;
      cursor: pointer; font-weight: 600;
      transition: all 0.25s;
      box-shadow: 0 4px 15px rgba(124,108,255,0.3);
    }
    .btn-new:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124,108,255,0.5);
    }

    .session-list { flex: 1; overflow-y: auto; padding: 8px; }
    .session-list::-webkit-scrollbar { width: 4px; }
    .session-list::-webkit-scrollbar-track { background: transparent; }
    .session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .sess-item-wrap {
      display: flex; align-items: center; margin-bottom: 3px;
      border-radius: 10px; position: relative;
      transition: all 0.2s;
    }
    .sess-item-wrap:hover { background: rgba(124,108,255,0.06); }
    .sess-item-wrap:hover .sess-delete { opacity: 1; }
    .sess-item {
      flex: 1; display: block; padding: 10px 12px; border-radius: 10px;
      text-decoration: none; color: var(--text);
      transition: all 0.2s; border: 1px solid transparent;
      min-width: 0;
    }
    .sess-item:hover { border-color: var(--border); }
    .sess-item.active {
      background: rgba(124,108,255,0.12);
      border-color: var(--accent);
      box-shadow: inset 0 0 20px rgba(124,108,255,0.05);
    }
    .sess-delete-form { flex-shrink: 0; padding-right: 6px; }
    .sess-delete {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 0.75em; padding: 4px 6px;
      border-radius: 6px; opacity: 0; transition: all 0.2s;
      line-height: 1;
    }
    .sess-delete:hover { background: rgba(248,113,113,0.15); color: var(--red); }
    .sess-title {
      display: block; font-size: 0.84em; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; font-weight: 500;
    }
    .sess-meta { display: block; font-size: 0.7em; color: var(--muted); margin-top: 3px; }

    /* ── 主区域 ── */
    .main-area {
      flex: 1; display: flex; flex-direction: column; height: 100vh;
      position: relative; z-index: 1;
    }

    /* ── 聊天区 ── */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 20px 28px;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 6px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(124,108,255,0.2); border-radius: 6px; }

    /* ── 消息气泡 ── */
    .message-row {
      display: flex; align-items: flex-start; gap: 10px;
      margin: 12px 0; animation: slideIn 0.3s ease-out;
    }
    .message-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; margin-top: 4px;
    }
    .msg-avatar.user-av {
      background: linear-gradient(135deg, #f97316, #f472b6);
      color: #fff; font-size: 14px;
    }
    .msg-avatar.assistant-av {
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      color: #fff; font-size: 14px;
    }

    .message {
      padding: 16px 20px; border-radius: var(--radius);
      max-width: 78%; line-height: 1.8;
      white-space: pre-wrap; word-break: break-word;
      font-size: 1em; position: relative;
    }
    .message.user {
      background: var(--user-bg);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(99,102,241,0.25);
    }
    .message.assistant {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 4px;
    }

    .error-card {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px; padding: 12px 16px;
      color: var(--red); font-size: 0.85em; margin: 8px 0;
    }

    /* ── 欢迎页面 ── */
    .welcome {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 65vh; text-align: center;
      animation: slideIn 0.5s ease-out;
    }
    .mascot {
      width: 140px; height: 140px; margin-bottom: 20px;
      animation: mascot-idle 4s ease-in-out infinite;
      filter: drop-shadow(0 10px 30px rgba(124,108,255,0.3));
    }
    .welcome h3 {
      font-size: 1.3em; font-weight: 700; margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: glow-text 3s ease-in-out infinite;
    }
    .welcome p { color: var(--muted); font-size: 0.88em; max-width: 380px; line-height: 1.6; }
    .welcome-agents {
      display: flex; gap: 16px; margin-top: 24px; flex-wrap: wrap; justify-content: center;
    }
    .welcome-agent {
      background: var(--glass); border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 14px 18px; min-width: 140px;
      backdrop-filter: blur(8px); transition: all 0.3s;
    }
    .welcome-agent:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 25px rgba(124,108,255,0.2);
    }
    .wa-emoji { font-size: 1.6em; margin-bottom: 4px; }
    .wa-name { font-size: 0.85em; font-weight: 600; color: var(--text); }
    .wa-desc { font-size: 0.72em; color: var(--muted); margin-top: 2px; }

    /* ── 进度卡片 ── */
    .stage-card {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; margin: 4px 0; border-radius: 10px;
      background: var(--glass); border: 1px solid var(--glass-border);
      font-size: 0.84em; backdrop-filter: blur(8px);
      animation: slideIn 0.25s ease-out;
    }
    .stage-card.stage-done { border-color: rgba(34,211,167,0.3); opacity: 0.8; }
    .stage-num {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      color: #fff; font-size: 0.7em; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px rgba(124,108,255,0.3);
    }
    .stage-card.stage-done .stage-num {
      background: linear-gradient(135deg, var(--green), #34d399);
      box-shadow: 0 0 12px rgba(34,211,167,0.3);
    }
    .stage-text { color: var(--muted); flex: 1; }

    /* ── Agent 卡片 ── */
    .agent-card {
      margin: 6px 0; border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass); backdrop-filter: blur(8px);
      overflow: hidden; animation: slideIn 0.3s ease-out;
    }
    .agent-card-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; font-size: 0.85em; font-weight: 600;
      cursor: pointer; user-select: none; transition: background 0.2s;
    }
    .agent-card-header:hover { background: rgba(124,108,255,0.06); }
    .agent-card-arrow { color: var(--muted); font-size: 0.7em; transition: transform 0.2s; }
    .agent-card.expanded .agent-card-arrow { transform: rotate(180deg); }
    .agent-card-preview {
      padding: 0 14px 10px; font-size: 0.8em; color: var(--muted);
      line-height: 1.5; max-height: 50px; overflow: hidden;
    }
    .agent-card-full {
      display: none; padding: 0 14px 12px; font-size: 0.83em;
      line-height: 1.75; color: var(--text); max-height: 300px; overflow-y: auto;
      border-top: 1px solid var(--border);
    }
    .agent-card.expanded .agent-card-preview { display: none; }
    .agent-card.expanded .agent-card-full { display: block; }

    /* ── 搜索结果卡片 ── */
    .search-results-card {
      margin: 6px 0; border-radius: 10px;
      border: 1px solid rgba(34,211,167,0.2);
      background: var(--glass); backdrop-filter: blur(8px);
      overflow: hidden; animation: slideIn 0.3s ease-out;
    }
    .sr-header {
      padding: 8px 14px; font-weight: 600; font-size: 0.82em;
      background: rgba(34,211,167,0.08);
      border-bottom: 1px solid rgba(34,211,167,0.15);
      color: var(--green);
    }
    .sr-list { list-style: none; padding: 8px 14px; margin: 0; }
    .sr-item {
      padding: 6px 0; font-size: 0.8em; line-height: 1.5;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .sr-item:last-child { border-bottom: none; }
    .sr-link { color: var(--cyan); text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .sr-link:hover { color: var(--accent2); text-decoration: underline; }
    .sr-title { color: var(--text); font-weight: 500; }
    .sr-snippet { color: var(--muted); font-size: 0.92em; }
    .sr-empty { color: var(--muted); font-style: italic; }

    /* ── Markdown 渲染 ── */
    .md-body { line-height: 1.9; font-size: 1.02em; }
    .md-body h1 {
      font-size: 1.25em; font-weight: 700; margin: 20px 0 10px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .md-body h2 {
      font-size: 1.12em; font-weight: 700; margin: 18px 0 8px;
      padding-left: 10px;
      border-left: 3px solid var(--accent);
      color: var(--text);
    }
    .md-body h3 {
      font-size: 1.02em; font-weight: 600; margin: 14px 0 6px;
      color: var(--accent);
    }
    .md-body h4 {
      font-size: 0.95em; font-weight: 600; margin: 10px 0 4px;
      color: var(--muted);
    }
    .md-body p { margin: 8px 0; }
    .md-body strong { color: #d4b8ff; font-weight: 600; }
    .md-body em { color: var(--cyan); font-style: italic; }
    .md-body ul, .md-body ol {
      margin: 8px 0; padding-left: 22px;
    }
    .md-body li { margin: 4px 0; }
    .md-body li::marker { color: var(--accent); }
    .md-body blockquote {
      margin: 12px 0; padding: 10px 16px;
      border-left: 3px solid var(--cyan);
      background: rgba(0,212,255,0.04);
      border-radius: 0 8px 8px 0;
      color: var(--muted);
    }
    .md-body code {
      background: rgba(124,108,255,0.1);
      padding: 2px 6px; border-radius: 4px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.88em; color: var(--cyan);
    }
    .md-body pre {
      margin: 12px 0; padding: 14px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 10px; overflow-x: auto;
    }
    .md-body pre code {
      background: none; padding: 0; color: var(--text);
      font-size: 0.85em; line-height: 1.6;
    }
    .md-body hr {
      border: none; border-top: 1px solid var(--border);
      margin: 16px 0;
    }
    .md-body table {
      width: 100%; border-collapse: collapse; margin: 12px 0;
      font-size: 0.9em;
    }
    .md-body th {
      background: rgba(124,108,255,0.1);
      padding: 8px 12px; text-align: left; font-weight: 600;
      border-bottom: 2px solid var(--border);
    }
    .md-body td {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .md-body tr:hover td { background: rgba(124,108,255,0.03); }
    .md-body a {
      color: var(--cyan); text-decoration: none;
      border-bottom: 1px solid rgba(34,211,238,0.3);
      transition: border-color 0.2s;
    }
    .md-body a:hover { border-bottom-color: var(--cyan); }

    /* ── 结果摘要 / 费用 ── */
    .result-summary {
      text-align: center; font-size: 0.82em; color: var(--green);
      padding: 8px 0; margin: 6px 0 2px;
      border-top: 1px solid rgba(34,211,167,0.2);
    }
    .cost-line {
      text-align: center; font-size: 0.88em; color: var(--accent);
      padding: 10px 18px; margin: 8px auto; max-width: 360px;
      background: rgba(124,108,255,0.06);
      border: 1px solid rgba(124,108,255,0.15);
      border-radius: 10px; font-weight: 500;
      backdrop-filter: blur(8px);
    }

    /* ── 输入区 ── */
    .input-area {
      padding: 14px 28px 18px;
      border-top: 1px solid var(--border);
      display: flex; gap: 12px; align-items: flex-end;
      background: rgba(8,12,24,0.6);
      backdrop-filter: blur(16px);
    }
    .input-area textarea {
      flex: 1; background: var(--glass); border: 1px solid var(--glass-border);
      color: var(--text); padding: 14px 16px; border-radius: var(--radius);
      resize: none; font-size: 0.95em; font-family: inherit;
      min-height: 48px; max-height: 120px;
      transition: border-color 0.3s, box-shadow 0.3s;
      backdrop-filter: blur(8px);
    }
    .input-area textarea::placeholder { color: var(--muted); }
    .input-area textarea:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 20px rgba(124,108,255,0.15);
    }
    .btn-send {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff; border: none;
      padding: 14px 28px; border-radius: var(--radius);
      cursor: pointer; font-size: 0.95em; font-weight: 600;
      transition: all 0.25s; white-space: nowrap;
      box-shadow: 0 4px 15px rgba(124,108,255,0.3);
    }
    .btn-send:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124,108,255,0.5);
    }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Loading ── */
    /* ── 脉冲点（替代闪烁旋转） ── */
    .pulse-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); margin-right: 8px; vertical-align: middle;
      box-shadow: 0 0 6px var(--accent);
      animation: pulse-soft 2s ease-in-out infinite;
    }
    @keyframes pulse-soft {
      0%,100% { opacity: 0.4; box-shadow: 0 0 4px var(--accent); }
      50%     { opacity: 1;   box-shadow: 0 0 12px var(--accent), 0 0 20px rgba(124,108,255,0.3); }
    }
    .typing-dots { display: inline-flex; gap: 4px; margin-left: 4px; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      animation: typing-dot 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

    /* ── 角色标签颜色 ── */
    .role-divergent { color: var(--cyan); }
    .role-rigorous  { color: var(--accent); }
    .role-critical  { color: var(--pink); }

    /* ── 响应式 ── */
    @media (max-width: 640px) {
      #sidebar { display: none; }
      .chat-area { padding: 12px 14px; }
      .message { max-width: 92%; font-size: 0.88em; }
      .input-area { padding: 10px 14px 14px; }
      .welcome-agents { gap: 10px; }
      .welcome-agent { min-width: 110px; padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  {% block sidebar %}{% endblock %}

  <div class="main-area">
    <div id="chat-area" class="chat-area">
      {% block content %}{% endblock %}
    </div>
    {% block input_area %}{% endblock %}
  </div>

  <script>
    // ── 星空粒子 ──
    (function() {
      const c = document.getElementById('stars');
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2 + 1;
        s.style.cssText = `
          width:${size}px;height:${size}px;
          left:${Math.random()*100}%;top:${Math.random()*100}%;
          animation-duration:${Math.random()*3+2}s;
          animation-delay:${Math.random()*3}s;
          opacity:${Math.random()*0.5+0.1};
        `;
        c.appendChild(s);
      }
    })();

    // ── Markdown 渲染 ──
    marked.setOptions({
      breaks: true,
      gfm: true,
      headerIds: false,
      mangle: false,
    });

    function renderMarkdown(el) {
      if (!el || el.dataset.mdRendered) return;
      if (!el.classList.contains('assistant')) return;
      const raw = el.textContent || el.innerText;
      el.innerHTML = marked.parse(raw);
      el.classList.add('md-body');
      el.dataset.mdRendered = '1';
    }

    // 渲染页面上已有的 assistant 消息
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.message.assistant').forEach(renderMarkdown);
    });

    // 监听 HTMX 动态插入的内容
    document.addEventListener('htmx:afterSwap', function(e) {
      const target = e.detail.target;
      if (target.classList && target.classList.contains('message') && target.classList.contains('assistant')) {
        renderMarkdown(target);
      }
      target.querySelectorAll && target.querySelectorAll('.message.assistant').forEach(renderMarkdown);
    });

    // 额外：轮询更新后也尝试渲染
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(m) {
        m.addedNodes.forEach(function(node) {
          if (node.nodeType === 1) {
            if (node.classList && node.classList.contains('message') && node.classList.contains('assistant')) {
              renderMarkdown(node);
            }
            node.querySelectorAll && node.querySelectorAll('.message.assistant').forEach(renderMarkdown);
          }
        });
      });
    });
    observer.observe(document.getElementById('chat-area'), { childList: true, subtree: true });
  </script>
</body>
</html>
