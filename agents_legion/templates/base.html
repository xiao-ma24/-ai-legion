<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 军团 — 多智能体协同</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #f1f5f9; --muted: #94a3b8; --accent: #6366f1;
      --green: #10b981; --yellow: #f59e0b; --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex;
    }
    /* ── 侧边栏 ── */
    #sidebar {
      width: 260px; min-width: 260px; height: 100vh;
      background: #0c1222; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header {
      padding: 16px; border-bottom: 1px solid var(--border);
    }
    .sidebar-header h2 { font-size: 1.1em; color: var(--accent); margin-bottom: 10px; }
    .btn-new {
      display: block; width: 100%; padding: 8px; border-radius: 8px;
      background: var(--accent); color: #fff; border: none; font-size: 0.88em;
      cursor: pointer; font-weight: 600; text-align: center;
    }
    .btn-new:hover { opacity: 0.9; }
    .session-list { flex: 1; overflow-y: auto; padding: 8px; }
    .sess-item {
      display: block; padding: 10px 12px; border-radius: 8px;
      text-decoration: none; color: var(--text); margin-bottom: 2px;
      transition: background 0.15s;
    }
    .sess-item:hover { background: var(--surface); }
    .sess-item.active { background: rgba(99,102,241,0.15); }
    .sess-title {
      display: block; font-size: 0.85em; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .sess-meta { display: block; font-size: 0.72em; color: var(--muted); margin-top: 2px; }
    /* ── 主区域 ── */
    .main-area { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .chat-area {
      flex: 1; overflow-y: auto; padding: 16px 24px; scroll-behavior: smooth;
    }
    .message {
      margin: 10px 0; padding: 12px 16px; border-radius: 10px;
      max-width: 85%; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
      font-size: 0.93em;
    }
    .message.user { background: var(--accent); margin-left: auto; color: #fff; }
    .message.assistant { background: var(--surface); border: 1px solid var(--border); }
    .error-card {
      background: rgba(239,68,68,0.1); border: 1px solid var(--red);
      border-radius: 8px; padding: 12px; color: var(--red); font-size: 0.85em; margin: 8px 0;
    }
    /* ── 进度卡片 ── */
    .stage-card {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; margin: 3px 0; border-radius: 8px;
      background: var(--surface); border: 1px solid var(--border); font-size: 0.84em;
    }
    .stage-card.stage-done { border-color: var(--green); opacity: 0.75; }
    .stage-num {
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent); color: #fff; font-size: 0.72em;
      font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .stage-card.stage-done .stage-num { background: var(--green); }
    .stage-text { color: var(--muted); flex: 1; }
    /* ── Agent 折叠卡片 ── */
    .agent-card {
      margin: 5px 0; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); overflow: hidden;
    }
    .agent-card-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; font-size: 0.84em; font-weight: 600;
      cursor: pointer; user-select: none;
    }
    .agent-card-header:hover { background: rgba(99,102,241,0.05); }
    .agent-card-arrow { color: var(--muted); font-size: 0.7em; transition: transform 0.2s; }
    .agent-card.expanded .agent-card-arrow { transform: rotate(180deg); }
    .agent-card-preview {
      padding: 0 12px 8px; font-size: 0.8em; color: var(--muted);
      line-height: 1.5; max-height: 50px; overflow: hidden;
    }
    .agent-card-full {
      display: none; padding: 0 12px 10px; font-size: 0.82em;
      line-height: 1.7; color: var(--text); max-height: 300px; overflow-y: auto;
      border-top: 1px solid var(--border);
    }
    .agent-card.expanded .agent-card-preview { display: none; }
    .agent-card.expanded .agent-card-full { display: block; }
    /* ── 最终结果 ── */
    .result-summary {
      text-align: center; font-size: 0.78em; color: var(--green);
      padding: 6px 0; margin: 4px 0; border-top: 1px solid var(--border);
    }
    /* ── 输入区 ── */
    .input-area { padding: 12px 24px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
    .input-area textarea {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 12px; border-radius: 10px; resize: none;
      font-size: 0.95em; font-family: inherit; min-height: 50px;
    }
    .input-area textarea:focus { outline: none; border-color: var(--accent); }
    .input-area button {
      background: var(--accent); color: #fff; border: none;
      padding: 12px 24px; border-radius: 10px; cursor: pointer;
      font-size: 0.95em; font-weight: 600;
    }
    .input-area button:hover { opacity: 0.9; }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--muted); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 640px) {
      #sidebar { display: none; }
      .message { max-width: 95%; font-size: 0.88em; }
    }
  </style>
</head>
<body>
  {% block sidebar %}{% endblock %}
  <div class="main-area">
    <div id="chat-area" class="chat-area">
      {% block content %}{% endblock %}
    </div>
    {% block input_area %}{% endblock %}
  </div>
</body>
</html>
